# Despliegue del backend de Notium en un VPS (tarea 1.6).
# Requiere un archivo .env junto a este compose con:
#   JWT_SECRET, JWT_REFRESH_SECRET, POSTGRES_PASSWORD
# (ver .env.example; DATABASE_URL no hace falta: se arma aquí apuntando a `db`).

services:
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/notium
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 3000
    ports:
      # Solo loopback: el tráfico público debe entrar por el reverse proxy
      # con TLS (sección 8 del doc — HTTPS obligatorio). Ver DEPLOY.md.
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: notium
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notium"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  uploads:
